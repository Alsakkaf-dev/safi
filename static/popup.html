<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><link rel="stylesheet" href="ui.css"></head>
<body>
<div class="pop">
  <div class="row" style="justify-content:space-between">
    <div class="brand"><img src="icons/48.png" alt=""><span>Safi · صافي</span></div>
    <input id="enabled" class="switch" type="checkbox" aria-labelledby="state">
  </div>
  <div id="state" class="muted"></div>
  <div>
    <div class="muted" data-i18n="popMode" style="margin-bottom:4px"></div>
    <div class="seg">
      <label><input type="radio" name="mode" id="modeLabel" value="label"><span data-i18n="modeLabel"></span></label>
      <label><input type="radio" name="mode" id="modeHide" value="hide"><span data-i18n="modeHide"></span></label>
    </div>
  </div>
  <div class="nums">
    <div><b id="page">0</b><span class="muted" data-i18n="popPage"></span></div>
    <div><b id="total">0</b><span class="muted" data-i18n="popTotal"></span></div>
  </div>
  <button id="options" class="btn" type="button" data-i18n="popOptions"></button>
</div>
<script src="popup.js"></script>
</body>
</html>
